<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-up</title>
</head>
<body>
    <div class="container">
        <div class="advertisement-container">
            <div class="logo-container">
                <img src="images/odin-lined.png" alt="Odin Project Logo">
                <div class="logo-container-text">ODIN</div>
            </div>
            <div class="photo-credit">Photo by &nbsp<a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Halie West</a>&nbspon&nbsp<a href="https://unsplash.com/">Unsplash</a></div>
        </div>
        <div class="sign-up-form-container">
            <div class="section-1 section">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <span class="italic-text">now</span> to get started.</p>
                <p>You <span class="italic-text">know</span> you want to.</p>
            </div>
            <div class="section-2 section">
                <div class="section-2-title">Let's do this!</div>
                <form id="my-form" action="" method="post">
                    <section>
                        <div>
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="first-name">
                        </div>
                        <div>
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="last-name">
                        </div>
                    </section>
                    <section>
                        <div>
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div>
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="tel" id="phone-number" name="phone-number">
                        </div>
                    </section>
                    <section>
                        <div>
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div>
                            <label for="confirm-password">CONFIRM PASSWORD</label>
                            <input type="password" id="confirm-password" name="confirm-password" required>
                        </div>
                    </section>
                </form>
            </div>
            <div class="section-3 section">
                <button type="submit" form="my-form">Create Account</button>
                <div class="login">Already have an account? <span><a href="">Log in</a></span></div>
            </div>
        </div>
    </div>
</body>
</html>
